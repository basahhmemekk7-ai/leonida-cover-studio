<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Cover Studio — your photos become Vice City poster art</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">LC</span>
    <div>
      <h1>Leonida Cover Studio</h1>
      <p>Your photos become Vice City poster art. Nothing leaves your machine.</p>
    </div>
  </div>
  <button id="demo" type="button" class="cta">Make me a cover</button>
</header>

<main class="studio">
  <aside class="sidebar">
    <section class="panel">
      <h2>Photos</h2>
      <div id="dropzone" class="dropzone">
        <p>Drop photos here, or</p>
        <label class="pick" for="file-input">Choose photos</label>
        <input id="file-input" type="file" accept="image/*" multiple hidden>
      </div>
      <div id="library" class="library" aria-label="Photo library"></div>
      <p class="hint">Click a photo to put it in the selected panel. Double-click to fill every panel with it.</p>
    </section>

    <section class="panel">
      <h2>Layout</h2>
      <div id="layout-group" class="group three" role="group" aria-label="Layout"></div>
    </section>

    <section class="panel">
      <h2>Post size</h2>
      <div id="size-group" class="group three" role="group" aria-label="Post size"></div>
    </section>

    <section class="panel">
      <h2>Colour grade</h2>
      <div id="grade-group" class="group two" role="group" aria-label="Colour grade"></div>
    </section>

    <section class="panel">
      <h2>Caption</h2>
      <label class="field">Title
        <input id="title" type="text" maxlength="40" value="Leonida Nights" autocomplete="off">
      </label>
      <label class="field">Subtitle
        <input id="subtitle" type="text" maxlength="48" value="Vice City • 2026" autocomplete="off">
      </label>
    </section>

    <section class="panel">
      <h2>Export PNG</h2>
      <div class="exports">
        <button type="button" data-export="square">Square<br><small>1080 × 1080</small></button>
        <button type="button" data-export="portrait">Portrait<br><small>1080 × 1350</small></button>
        <button type="button" data-export="landscape">Landscape<br><small>1920 × 1080</small></button>
      </div>
      <button id="export-all" type="button" class="wide">Export all three sizes</button>
    </section>
  </aside>

  <section class="stage">
    <div class="canvas-wrap">
      <canvas id="preview" width="1080" height="1080" aria-label="Cover preview"></canvas>
    </div>
    <div class="panelbar">
      <span id="panel-label">Panel 1 of 5 • Hero</span>
      <label class="zoom">Zoom <span id="zoom-value">1.00×</span>
        <input id="zoom" type="range" min="1" max="3" step="0.01" value="1">
      </label>
      <button id="fill-all" type="button">Use in all panels</button>
    </div>
    <p id="status" class="status" role="status"></p>
  </section>
</main>

<script type="module" src="./src/main.js"></script>
</body>
</html>
